<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANSH Ultra-Fast Universal Private Browser</title>
  
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Three.js 3D Graphics Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      background-color: #030712; 
      color: #f3f4f6; 
    }

    /* Cyber Glassmorphism Aesthetics */
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(102, 252, 241, 0.25);
      box-shadow: 0 0 30px rgba(102, 252, 241, 0.12);
    }

    .glass-input {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(102, 252, 241, 0.3);
    }

    .glass-input:focus-within {
      border-color: #66fcf1;
      box-shadow: 0 0 25px rgba(102, 252, 241, 0.4);
    }

    /* Floating HUD Animation */
    #hud-bar {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #hud-bar.hidden-hud {
      transform: translate(-50%, 120%);
      opacity: 0;
      pointer-events: none;
    }

    /* Custom Animated Pulse Glow */
    @keyframes neonPulse {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(102, 252, 241, 0.6)); }
      50% { filter: drop-shadow(0 0 25px rgba(102, 252, 241, 0.9)); }
    }

    .neon-glow {
      animation: neonPulse 3s infinite ease-in-out;
    }

    /* Scrollbar Customization */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #030712; }
    ::-webkit-scrollbar-thumb { background: #66fcf1; border-radius: 4px; }
  </style>
</head>
<body class="relative w-full h-full select-none">

  <!-- ========================================== -->
  <!-- 1. DASHBOARD & 3D ANIMATION SCREEN        -->
  <!-- ========================================== -->
  <div id="dashboard" class="absolute inset-0 z-20 flex flex-col items-center justify-between p-4 md:p-6 bg-gradient-to-b from-gray-950 via-slate-950 to-black overflow-y-auto">
    
    <!-- Top Bar Header -->
    <div class="w-full max-w-6xl flex justify-between items-center z-10 py-2">
      <div class="flex items-center gap-3">
        <span class="relative flex h-3 w-3">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-cyan-500"></span>
        </span>
        <span class="text-xs font-mono tracking-widest text-cyan-400 uppercase font-semibold">ANSH Private Engine v3.0</span>
      </div>

      <div class="flex items-center gap-2 text-xs">
        <span class="bg-slate-800/80 text-gray-300 px-3 py-1 rounded-full border border-slate-700 flex items-center gap-1.5">
          <i class="fa-brands fa-google text-red-400"></i> Google Sign-In Ready
        </span>
        <span class="bg-slate-800/80 text-cyan-400 px-3 py-1 rounded-full border border-slate-700 flex items-center gap-1.5">
          <i class="fa-solid fa-shield-halved"></i> Zero-Logs
        </span>
      </div>
    </div>

    <!-- Center 3D Interactive Area & Search -->
    <div class="relative flex flex-col items-center justify-center my-auto w-full max-w-2xl z-10 py-4">
      
      <!-- 3D Globe & ANSH Typography Container -->
      <div id="canvas-container" class="w-[280px] h-[280px] sm:w-[320px] sm:h-[320px] relative neon-glow"></div>
      
      <!-- Universal Natural Language & Intent Input -->
      <div class="w-full max-w-xl mt-2 px-2">
        <div class="glass-input flex items-center rounded-full px-4 py-1.5 relative transition-all">
          <i class="fa-solid fa-bolt text-cyan-400 text-lg ml-2 mr-3"></i>
          <input type="text" id="url-input" 
            placeholder="Kuch bhi likhein (jaise: 'aaj gana sunna hai', 'up e district', 'sarkari result')..." 
            class="w-full bg-transparent border-none outline-none text-white placeholder-gray-400 text-sm sm:text-base py-2"
            onkeydown="if(event.key === 'Enter') processSmartQuery();"
            blur="this.focus()"
            autofocus
          >
          <button onclick="processSmartQuery()" class="ml-2 bg-gradient-to-r from-cyan-400 to-blue-600 hover:from-cyan-300 hover:to-blue-500 text-slate-950 font-extrabold px-6 py-2.5 rounded-full transition-all shadow-lg hover:shadow-cyan-500/50 flex items-center gap-2">
            <span>GO</span>
            <i class="fa-solid fa-arrow-right text-xs"></i>
          </button>
        </div>
      </div>

      <!-- Quick Launch Shortcuts -->
      <div class="flex flex-wrap justify-center gap-2 mt-6 max-w-2xl">
        <button onclick="launchSite('https://www.youtube.com')" class="glass-card hover:bg-red-600/30 text-xs px-3.5 py-2 rounded-full border border-red-500/40 text-red-300 transition flex items-center gap-1.5">
          <i class="fa-brands fa-youtube text-red-500 text-sm"></i> YouTube & Login
        </button>
        <button onclick="launchSite('https://edistrict.up.gov.in')" class="glass-card hover:bg-cyan-500/20 text-xs px-3.5 py-2 rounded-full border border-cyan-500/30 text-cyan-300 transition flex items-center gap-1.5">
          <i class="fa-solid fa-building-columns"></i> UP eDistrict
        </button>
        <button onclick="launchSite('https://www.sarkariresult.com')" class="glass-card hover:bg-cyan-500/20 text-xs px-3.5 py-2 rounded-full border border-cyan-500/30 text-cyan-300 transition flex items-center gap-1.5">
          <i class="fa-solid fa-graduation-cap"></i> Sarkari Result
        </button>
        <button onclick="launchSite('https://digitalseva.csc.gov.in')" class="glass-card hover:bg-cyan-500/20 text-xs px-3.5 py-2 rounded-full border border-cyan-500/30 text-cyan-300 transition flex items-center gap-1.5">
          <i class="fa-solid fa-id-card"></i> CSC Portal
        </button>
        <button onclick="launchSite('https://accounts.google.com')" class="glass-card hover:bg-blue-600/30 text-xs px-3.5 py-2 rounded-full border border-blue-500/40 text-blue-300 transition flex items-center gap-1.5">
          <i class="fa-brands fa-google text-blue-400"></i> Google Sign-In
        </button>
      </div>
    </div>

    <!-- Footer Security Notice -->
    <div class="text-center text-xs text-gray-500 z-10 py-2">
      <p>ANSH Universal AI Browser Engine • High-Speed Web Navigation • Zero Session Footprint</p>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 2. FULL VIEW BROWSER CANVAS (NO ADDRESS BAR)-->
  <!-- ========================================== -->
  <iframe id="browser-frame" 
    class="w-full h-full border-none hidden absolute inset-0 z-10 bg-white"
    allow="camera; microphone; geolocation; fullscreen; autoplay; encrypted-media; clipboard-read; clipboard-write; display-capture; notifications"
    sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-downloads"
  ></iframe>

  <!-- ========================================== -->
  <!-- 3. FLOATING HUD CONTROL BAR                -->
  <!-- ========================================== -->
  <div id="hud-bar" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-30 hidden-hud">
    <div class="glass-card flex items-center gap-3 px-5 py-2.5 rounded-full border border-cyan-500/40 shadow-2xl">
      <!-- Return Dashboard -->
      <button onclick="goHome()" title="Home / Clear Session" class="w-9 h-9 flex items-center justify-center rounded-full bg-cyan-500/20 hover:bg-cyan-500/40 text-cyan-300 transition">
        <i class="fa-solid fa-house"></i>
      </button>

      <div class="h-4 w-[1px] bg-slate-700"></div>

      <!-- Mode Switcher -->
      <button onclick="toggleProxyMode()" id="proxy-btn" class="px-3 py-1 text-xs rounded-full bg-blue-600/30 text-blue-300 border border-blue-500/40 font-mono hover:bg-blue-600/50 transition">
        Mode: Direct Frame
      </button>

      <!-- Reload Page -->
      <button onclick="reloadPage()" title="Reload Page" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-800 text-gray-300 transition">
        <i class="fa-solid fa-rotate-right text-sm"></i>
      </button>

      <!-- Downloads Drawer Toggle -->
      <button onclick="toggleDownloadDrawer()" title="Downloads Handler" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-800 text-cyan-400 relative transition">
        <i class="fa-solid fa-download text-sm"></i>
        <span id="dl-badge" class="hidden absolute -top-0.5 -right-0.5 w-2.5 h-2.5 bg-emerald-400 rounded-full animate-ping"></span>
      </button>

      <!-- Fullscreen Toggle -->
      <button onclick="toggleFullScreen()" title="Full Screen" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-800 text-gray-300 transition">
        <i class="fa-solid fa-expand text-sm"></i>
      </button>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 4. ACTIVE DOWNLOADS TRACKER DRAWER         -->
  <!-- ========================================== -->
  <div id="download-drawer" class="fixed bottom-20 right-6 z-40 w-80 glass-card rounded-2xl p-4 hidden border border-cyan-500/40 shadow-2xl">
    <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
      <h4 class="text-xs font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-2">
        <i class="fa-solid fa-circle-down"></i> Active Downloads Engine
      </h4>
      <button onclick="toggleDownloadDrawer()" class="text-gray-400 hover:text-white text-xs"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="download-list" class="space-y-2 text-xs text-gray-300 max-h-48 overflow-y-auto">
      <div class="p-2.5 bg-slate-900/80 rounded-xl border border-slate-800">
        <p class="font-semibold text-gray-200 truncate">ANSH_Session_Permissions.pdf</p>
        <div class="w-full bg-slate-800 h-1.5 rounded-full mt-2 overflow-hidden">
          <div class="bg-cyan-400 h-full w-full"></div>
        </div>
        <div class="flex justify-between text-[10px] text-gray-400 mt-1">
          <span>Status: Granted</span>
          <span class="text-emerald-400">100% Ready</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 5. JAVASCRIPT LOGIC ENGINE                 -->
  <!-- ========================================== -->
  <script>
    // ------------------------------------------
    // A. THREE.JS 3D SPHERE & "ANSH" NEON TEXT
    // ------------------------------------------
    let scene, camera, renderer, sphere, textMesh;
    let proxyMode = 'direct';
    let currentRawUrl = '';

    function init3D() {
      const container = document.getElementById('canvas-container');
      if (!container) return;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      
      const width = container.clientWidth;
      const height = container.clientHeight;
      renderer.setSize(width, height);
      container.appendChild(renderer.domElement);

      // Glowing Sphere Geometry
      const geometry = new THREE.SphereGeometry(1.55, 32, 32);
      const material = new THREE.MeshBasicMaterial({
        color: 0x66fcf1,
        wireframe: true,
        transparent: true,
        opacity: 0.65
      });
      sphere = new THREE.Mesh(geometry, material);
      scene.add(sphere);

      // Orbit Ring
      const ringGeo = new THREE.RingGeometry(2.1, 2.18, 32);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, side: THREE.DoubleSide });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI / 2;
      scene.add(ring);

      // 3D "ANSH" Neon Text
      const textCanvas = document.createElement('canvas');
      textCanvas.width = 512;
      textCanvas.height = 256;
      const ctx = textCanvas.getContext('2d');
      
      ctx.fillStyle = '#66fcf1';
      ctx.font = '900 110px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#66fcf1';
      ctx.shadowBlur = 30;
      ctx.fillText('ANSH', 256, 150);

      const textTexture = new THREE.CanvasTexture(textCanvas);
      const textGeo = new THREE.PlaneGeometry(2.4, 1.2);
      const textMat = new THREE.MeshBasicMaterial({ map: textTexture, transparent: true });
      textMesh = new THREE.Mesh(textGeo, textMat);
      scene.add(textMesh);

      camera.position.z = 3.3;

      function animate() {
        requestAnimationFrame(animate);
        sphere.rotation.x += 0.003;
        sphere.rotation.y += 0.007;
        ring.rotation.z += 0.004;
        renderer.render(scene, camera);
      }
      animate();
    }

    // ------------------------------------------
    // B. AI QUERY RESOLVER & AUTOMATIC INTENT
    // ------------------------------------------
    const directSiteMap = {
      'up e district': 'https://edistrict.up.gov.in',
      'edistrict': 'https://edistrict.up.gov.in',
      'edistrict up': 'https://edistrict.up.gov.in',
      'sarkari result': 'https://www.sarkariresult.com',
      'sarkariresult': 'https://www.sarkariresult.com',
      'csc': 'https://digitalseva.csc.gov.in',
      'csc portal': 'https://digitalseva.csc.gov.in',
      'pm kisan': 'https://pmkisan.gov.in',
      'uidai': 'https://uidai.gov.in',
      'aadhaar': 'https://uidai.gov.in',
      'google': 'https://www.google.com',
      'youtube': 'https://www.youtube.com',
      'facebook': 'https://www.facebook.com',
      'instagram': 'https://www.instagram.com',
      'wikipedia': 'https://www.wikipedia.org'
    };

    function processSmartQuery() {
      const input = document.getElementById('url-input').value.trim();
      if (!input) return;

      const lower = input.toLowerCase();
      let destinationUrl = '';

      // Direct Match Keyword
      if (directSiteMap[lower]) {
        destinationUrl = directSiteMap[lower];
      }
      // AI Intent recognition for songs / music / movies
      else if (lower.includes('gana') || lower.includes('song') || lower.includes('music') || lower.includes('sunna') || lower.includes('movie') || lower.includes('video') || lower.includes('cricket')) {
        destinationUrl = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(input);
      }
      // Direct Web Address Input
      else if (input.startsWith('http://') || input.startsWith('https://')) {
        destinationUrl = input;
      }
      else if (input.includes('.') && !input.includes(' ')) {
        destinationUrl = 'https://' + input;
      }
      // Default Search Engine Routing
      else {
        destinationUrl = 'https://www.google.com/search?q=' + encodeURIComponent(input);
      }

      launchSite(destinationUrl);
    }

    function launchSite(url) {
      currentRawUrl = url;
      const frame = document.getElementById('browser-frame');
      const dashboard = document.getElementById('dashboard');
      const hud = document.getElementById('hud-bar');

      let targetUrl = url;
      if (proxyMode === 'cors') {
        targetUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
      }

      frame.src = targetUrl;
      dashboard.style.display = 'none';
      frame.classList.remove('hidden');
      hud.classList.remove('hidden-hud');
    }

    function toggleProxyMode() {
      const btn = document.getElementById('proxy-btn');
      if (proxyMode === 'direct') {
        proxyMode = 'cors';
        btn.innerText = 'Mode: CORS Proxy';
        btn.className = 'px-3 py-1 text-xs rounded-full bg-amber-600/30 text-amber-300 border border-amber-500/40 font-mono';
      } else {
        proxyMode = 'direct';
        btn.innerText = 'Mode: Direct Frame';
        btn.className = 'px-3 py-1 text-xs rounded-full bg-blue-600/30 text-blue-300 border border-blue-500/40 font-mono';
      }

      if (currentRawUrl) launchSite(currentRawUrl);
    }

    function goHome() {
      const frame = document.getElementById('browser-frame');
      const dashboard = document.getElementById('dashboard');
      const hud = document.getElementById('hud-bar');

      // Clear Session Data & Destroy Frame Context
      frame.src = 'about:blank';
      frame.classList.add('hidden');
      hud.classList.add('hidden-hud');
      dashboard.style.display = 'flex';
      document.getElementById('url-input').value = '';
      currentRawUrl = '';
    }

    function reloadPage() {
      const frame = document.getElementById('browser-frame');
      if (frame.src) frame.src = frame.src;
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function toggleDownloadDrawer() {
      const drawer = document.getElementById('download-drawer');
      drawer.classList.toggle('hidden');
    }

    // Auto Init on Window Load
    window.addEventListener('load', () => {
      init3D();
      if ('Notification' in window && Notification.permission !== 'granted') {
        Notification.requestPermission();
      }
    });
  </script>
</body>
</html>
